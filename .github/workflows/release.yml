name: Release

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Check tag against Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Refuse a tag that is not v plus the package version
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version[[:space:]]*=[[:space:]]*"/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, "")
              sub(/".*/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "Cargo.toml has no [package] version"
            exit 1
          fi
          case "$version" in
            *[!0-9A-Za-z.+-]*)
              echo "Cargo.toml version is not a release version: ${version}"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} (expected v${version})"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each target builds on a GitHub-hosted runner of the same OS and CPU.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack Unix archive
        id: pack_unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="idlehand-${VERSION}-${TARGET}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${TARGET}/release/idlehand" "${stage}/idlehand"
          chmod 755 "${stage}/idlehand"
          tar -czf "${archive}" -C "${stage}" idlehand
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
      - name: Pack Windows archive
        id: pack_win
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "idlehand-$env:VERSION-$env:TARGET.zip"
          $stage = Join-Path $pwd "stage-archive"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/idlehand.exe" (Join-Path $stage "idlehand.exe")
          if (Test-Path $archive) { Remove-Item $archive }
          tar.exe --format zip -cf $archive -C $stage idlehand.exe
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.os == 'Windows' && steps.pack_win.outputs.archive || steps.pack_unix.outputs.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse a tag that is not v plus the package version
        run: |
          set -euo pipefail
          version="$(awk '
            /^\[package\]/ { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && /^version[[:space:]]*=[[:space:]]*"/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, "")
              sub(/".*/, "")
              print
              exit
            }
          ' Cargo.toml)"
          if [ -z "$version" ]; then
            echo "Cargo.toml has no [package] version"
            exit 1
          fi
          case "$version" in
            *[!0-9A-Za-z.+-]*)
              echo "Cargo.toml version is not a release version: ${version}"
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} (expected v${version})"
            exit 1
          fi
          if [ "$version" != "${{ needs.verify.outputs.version }}" ]; then
            echo "build version ${{ needs.verify.outputs.version }} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          expected=(
            "idlehand-${VERSION}-aarch64-apple-darwin.tar.gz"
            "idlehand-${VERSION}-x86_64-apple-darwin.tar.gz"
            "idlehand-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "idlehand-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "idlehand-${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          for archive in "${expected[@]}"; do
            if [ ! -f "$archive" ]; then
              echo "missing ${archive}"
              exit 1
            fi
          done
          shopt -s nullglob
          for path in *; do
            known=0
            for archive in "${expected[@]}"; do
              if [ "$path" = "$archive" ]; then
                known=1
                break
              fi
            done
            if [ "$known" -ne 1 ]; then
              echo "unexpected release file ${path}"
              exit 1
            fi
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          tag="v${VERSION}"
          notes="IdleHand ${VERSION}. SHA256SUMS is the sha256 of each archive."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${expected[@]}" SHA256SUMS --clobber
          else
            gh release create "$tag" "${expected[@]}" SHA256SUMS --title "$tag" --notes "$notes"
          fi

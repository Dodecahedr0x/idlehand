[project]
name = "idlehand"
version = "0.1.0"
description = "A local node that spends leftover subscription credits on open source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
idlehand = "idlehand.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["idlehand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

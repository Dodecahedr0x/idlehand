[package]
name = "idlehand"
version = "0.1.0"
edition = "2021"
description = "A local node that spends leftover subscription credits on open source"
readme = "README.md"
publish = false

[[bin]]
name = "idlehand"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2"
ratatui = "0.30.2"
regex = "1"
serde_json = "1"
signal-hook = "0.3"
toml = { version = "0.8", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
